name: Create Release

on:
  push:
    branches: [ main ]
  # Actions 탭에서 브랜치를 골라 수동 실행할 수 있다.
  # 인프라 세팅 중 배포를 반복 시도할 때 main 머지 없이 돌리기 위한 용도.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        uses: ./.github/actions/calculate-version

  release:
    needs: calculate-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: gh release create "v${{ needs.calculate-version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    needs: [ calculate-version, release ]
    # EC2가 ARM64(t4g)이므로 ARM 러너에서 네이티브 빌드한다. QEMU 에뮬레이션 불필요.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Repository 접근
        uses: actions/checkout@v4

      - name: JDK 25 셋팅
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 애플리케이션 JAR 빌드
        run: |
          ./gradlew bootJar --no-daemon --build-cache
          BOOT_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$BOOT_JAR"
          cp "$BOOT_JAR" build/libs/app.jar

      # GHCR 이미지 경로는 소문자만 허용하므로 owner/repo를 소문자로 변환한다.
      - name: 이미지 이름 계산
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:v${{ needs.calculate-version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,scope=backend-runtime,mode=max

      - name: 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: 3600
          APP_JWT_REFRESH_TOKEN_EXPIRATION_SECONDS: 1209600
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{secrets.GOOGLE_OAUTH_CLIENT_SECRET}}
          APP_OAUTH2_REDIRECT_SUCCESS_URL: ${{ secrets.OAUTH2_REDIRECT_SUCCESS_URL }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          GEMINI_PROJECT_ID: ${{ secrets.GEMINI_PROJECT_ID }}
          GEMINI_ENABLED: ${{ secrets.GEMINI_ENABLED }}
          GA_ENABLED: ${{ secrets.GA_ENABLED }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
          AMPLITUDE_ENABLED: ${{ secrets.AMPLITUDE_ENABLED }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          # GHCR pull용 자격증명. GITHUB_TOKEN은 이 잡이 도는 동안만 유효하므로
          # 패키지를 private으로 두어도 별도 PAT 없이 pull이 된다.
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_HOST,DATABASE_USERNAME,DATABASE_PASSWORD,APP_JWT_SECRET,APP_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS,APP_JWT_REFRESH_TOKEN_EXPIRATION_SECONDS,APP_OAUTH2_REDIRECT_SUCCESS_URL,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,APP_CORS_ALLOWED_ORIGINS,ADMIN_USER_IDS,FIREBASE_SERVICE_ACCOUNT_JSON,AWS_S3_BUCKET,AWS_S3_REGION,AWS_S3_ACCESS_KEY,AWS_S3_SECRET_KEY,GEMINI_PROJECT_ID,GEMINI_ENABLED,GA_ENABLED,GA_MEASUREMENT_ID,GA_API_SECRET,AMPLITUDE_ENABLED,AMPLITUDE_API_KEY,GHCR_USERNAME,GHCR_TOKEN
          script: |
            mkdir -p /home/ubuntu/app/secrets
            # 시크릿이 없을 때 빈 파일을 만들면 앱이 그 파일을 Firebase 자격증명으로
            # 읽으려다 기동에 실패한다. 값이 있을 때만 쓰고, 없으면 지운다.
            if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
              echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /home/ubuntu/app/secrets/firebase-service-account.json
            else
              rm -f /home/ubuntu/app/secrets/firebase-service-account.json
            fi
            curl -fsSL https://raw.githubusercontent.com/Junhyukkkk/vs-server/main/scripts/setup-docker-caddy.sh \
              | bash
            curl -fsSL https://raw.githubusercontent.com/Junhyukkkk/vs-server/main/scripts/deploy.sh \
              | bash -s ${{ steps.image.outputs.name }}:v${{ needs.calculate-version.outputs.version }}
