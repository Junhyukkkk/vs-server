spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}/neondb?sslmode=require&channelBinding=require
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 0
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 3000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - email
              - profile
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: FRAMEWORK

app:
  oauth2:
    # 프론트엔드 도메인. GitHub Actions secrets로 주입한다.
    redirect-success-url: ${APP_OAUTH2_REDIRECT_SUCCESS_URL:https://example.com/oauth2/redirect}
    extra-info-url: ${APP_OAUTH2_EXTRA_INFO_URL:https://example.com/extra-info}
  cookie:
    secure: true
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiration-seconds: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
    refresh-token-expiration-seconds: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}

  cors:
    # 브라우저에서 호출하는 프론트엔드 도메인을 APP_CORS_ALLOWED_ORIGINS에 콤마로 구분해 설정한다.
    # 예: APP_CORS_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
    # 기본값은 로컬 프론트 개발용만 포함한다. 운영 프론트 도메인은 반드시 환경변수로 주입할 것.
    # 백엔드 서버간 직접 호출에는 브라우저 CORS 검사가 적용되지 않는다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,Accept,Origin}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${APP_CORS_MAX_AGE:3600}

springdoc:
  server-url: https://api.vs.io.kr

management:
  server:
    port: 8081
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
