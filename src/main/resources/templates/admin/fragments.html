<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>admin fragments</title>
</head>
<body>

<!-- 어드민 페이지 간 이동 네비게이션. topbar 안에서 오른쪽으로 밀려 붙는다(topbar-nav CSS 참고). -->
<nav th:fragment="nav" class="topbar-nav">
    <a href="/admin/votes">투표 생성</a>
    <a href="/admin/analytics">이벤트 분석</a>
</nav>

<!--
  어드민 공통 스타일. 정적 리소스(/css/**)를 새로 열지 않으려고 인라인 fragment로 둔다.
  라이트/다크 모두 대응한다.
-->
<th:block th:fragment="styles">
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #e2e5ea;
            --text: #1b1e24;
            --muted: #6b7280;
            --accent: #3b5bfd;
            --accent-text: #ffffff;
            --ok-bg: #e7f7ee;
            --ok-text: #10693f;
            --err-bg: #fdecec;
            --err-text: #a32323;
            --warn-text: #9a6300;
            --chip: #eef0f4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14161a;
                --surface: #1c1f25;
                --border: #2c3038;
                --text: #e8eaed;
                --muted: #9aa1ad;
                --accent: #6d86ff;
                --accent-text: #0d1017;
                --ok-bg: #10321f;
                --ok-text: #79dfa8;
                --err-bg: #3a1a1a;
                --err-text: #ff9d9d;
                --warn-text: #f0c060;
                --chip: #262a31;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
            "Malgun Gothic", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.55;
        }

        .topbar {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .topbar h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
        .topbar-sub { color: var(--muted); font-size: 13px; }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px 20px 64px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 15px;
            font-weight: 600;
        }

        .card h2 small { color: var(--muted); font-weight: 400; }

        .field { margin-bottom: 18px; border: 0; padding: 0; }

        .field > label, .field > legend {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 0;
        }

        .req {
            color: var(--accent);
            font-size: 11px;
            font-weight: 500;
            margin-left: 4px;
        }

        input[type="text"], input[type="url"], input[type="date"], input[type="datetime-local"], textarea, select {
            width: 100%;
            padding: 9px 11px;
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        input[type="file"] {
            width: 100%;
            font-size: 13px;
            color: var(--muted);
        }

        textarea { resize: vertical; }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid var(--accent);
            outline-offset: -1px;
        }

        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .row > .field { flex: 1 1 220px; }

        .radios { display: flex; gap: 18px; flex-wrap: wrap; }

        .radio {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
        }

        .radio input:disabled + span { color: var(--muted); cursor: not-allowed; }
        .radio small { color: var(--muted); }

        .pane { display: none; }
        .pane.active { display: block; }

        .hint { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
        .hint.warn { color: var(--warn-text); }
        .error { margin: 5px 0 0; font-size: 12px; color: var(--err-text); }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .alert-success { background: var(--ok-bg); color: var(--ok-text); }
        .alert-error { background: var(--err-bg); color: var(--err-text); }

        .actions { margin-top: 24px; }

        .btn-primary {
            padding: 10px 22px;
            font: inherit;
            font-weight: 600;
            color: var(--accent-text);
            background: var(--accent);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-primary:hover { filter: brightness(1.08); }

        .table-scroll { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        th, td {
            padding: 9px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            white-space: nowrap;
        }

        th { color: var(--muted); font-weight: 600; }
        td.num, th.num { text-align: right; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

        .thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: block;
        }

        .options { display: flex; align-items: center; gap: 6px; }

        .chip {
            background: var(--chip);
            border-radius: 999px;
            padding: 2px 9px;
            font-size: 12px;
        }

        .vs { color: var(--muted); font-size: 11px; }

        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-live { background: var(--ok-bg); color: var(--ok-text); }
        .badge-done { background: var(--chip); color: var(--muted); }

        .empty { color: var(--muted); font-size: 14px; margin: 0; }

        .centered { max-width: 460px; margin: 80px auto; text-align: center; }
        .centered p { color: var(--muted); font-size: 14px; }

        .btn-link {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 22px;
            font-weight: 600;
            color: var(--accent-text);
            background: var(--accent);
            border-radius: 8px;
            text-decoration: none;
        }

        code {
            background: var(--chip);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 12px;
        }

        /* ── 페이지 간 이동 네비게이션 ── */
        .topbar-nav {
            margin-left: auto;
            display: flex;
            gap: 16px;
        }

        .topbar-nav a {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .topbar-nav a:hover { color: var(--text); }

        /* ── 어드민 분석 화면: 2단 레이아웃 ── */
        main.analytics-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 64px;
            align-items: start;
        }

        @media (max-width: 900px) {
            main.analytics-layout { grid-template-columns: 1fr; }
            .analytics-sidebar { position: static !important; max-height: none !important; }
        }

        .analytics-sidebar {
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .analytics-results { min-width: 0; }

        .metric-group { margin-bottom: 10px; }

        .metric-group summary {
            cursor: pointer;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        .metric-group summary:hover,
        .metric-group[open] summary { color: var(--text); }

        .metric-breakdown-caption {
            display: inline-block;
            margin: 2px 0 10px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            background: var(--chip);
            border-radius: 999px;
        }

        .metric-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }

        .metric-item:last-child { border-bottom: 0; }

        .metric-item input[type="checkbox"] { margin-top: 3px; flex: 0 0 auto; }

        .metric-item label { font-weight: 600; cursor: pointer; }

        .metric-item .metric-desc {
            display: block;
            font-weight: 400;
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }

        .metric-card { margin-bottom: 18px; }

        .metric-card .metric-group-badge {
            display: inline-block;
            font-size: 11px;
            color: var(--muted);
            background: var(--chip);
            border-radius: 999px;
            padding: 2px 9px;
            margin-bottom: 6px;
        }

        .metric-card .metric-summary {
            font-size: 15px;
            font-weight: 700;
            margin: 4px 0 14px;
        }

        .chart-svg {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 8px;
        }

        .chart-label {
            font-size: 10px;
            fill: var(--muted);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--muted);
        }

        .legend-item { display: flex; align-items: center; gap: 5px; }

        .legend-item i {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            display: inline-block;
        }
    </style>
</th:block>

</body>
</html>
